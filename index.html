<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淺山夜路：流浪犬與野生動物的故事</title>
  <link rel="stylesheet" href="picture-book.css?v=20261003-6">
  <style>
    body.focused-chat .chat-layout,
    body.scan-mode .chat-layout { display: block !important; }
    body.focused-chat .character-picker,
    body.scan-mode .character-picker { display: none !important; }
    .active-character { display: flex !important; align-items: center; gap: 0.85rem; }
    .active-role-portrait {
      position: relative; display: grid !important; place-items: center;
      width: 5rem; height: 5rem; flex: 0 0 5rem; overflow: hidden;
      border: 3px solid #ffc93c; border-radius: 50%; background: #fff7e8;
    }
    .active-role-portrait img { display: block !important; width: 115%; height: 115%; object-fit: contain; }
    .active-role-portrait img.dog-character-image {
      position: absolute; left: -38%; top: -148%; width: 400%; height: auto; max-width: none;
    }
  </style>
</head>
<body>
  <main>
    <!-- 分頁一：雙向繪本閱讀 -->
    <section id="read" class="view active" aria-labelledby="read-title">
      <div class="section-heading">
        <p class="eyebrow">雙向互動繪本</p>
        <h2 id="read-title">繪本閱讀</h2>
        <p>可從拉利或阿班的方向開始閱讀。看到黃色腳印時，點擊它進入角色對話。</p>
      </div>

      <!-- 閱讀方向：拉利從第 1 頁開始，阿班從第 15 頁反向開始 -->
      <div class="reading-paths" aria-label="閱讀方向">
        <button class="path-btn active" data-path="lali" type="button">
          <span>拉利～不怕！</span>
          <small>從 1 開始閱讀</small>
        </button>
        <button class="path-btn" data-path="aban" type="button">
          <span>阿班～不慌！</span>
          <small>從 15 開始閱讀</small>
        </button>
      </div>

      <!-- 繪本舞台：JS 會把封面預留頁或正式內頁圖片放進 bookImage -->
      <article class="reader-shell">
        <div class="book-stage">
          <div id="bookImage" class="book-image" role="img" aria-label="繪本頁面插圖">
            <div class="cover-placeholder">
              <span class="hill"></span>
              <span class="tree tree-a"></span>
              <span class="tree tree-b"></span>
              <span class="star star-a"></span>
              <span class="star star-b"></span>
            </div>
          </div>

          <!-- 黃色腳印互動熱區：正式圖上已有腳印時，這個按鈕會變成透明可點擊區 -->
          <button id="pawHint" class="paw-hint" type="button" hidden>
            <img class="paw-image" src="assets/nfc-paw-icon.png" alt="">
            <span class="paw-label">角色提問</span>
          </button>
        </div>

        <!-- 右側文字與翻頁控制 -->
        <div class="page-panel">
          <p id="pageNumber" class="page-number"></p>
          <h3 id="pageTitle"></h3>
          <p id="pageText"></p>
          <p id="hintText" class="hint-text"></p>
          <div class="reader-controls">
            <button id="prevPage" class="secondary-btn" type="button">上一頁</button>
            <div id="pageDots" class="page-dots" aria-label="頁面指示"></div>
            <button id="nextPage" class="primary-btn" type="button">下一頁</button>
          </div>
        </div>
      </article>
    </section>

    <!-- 分頁二：角色對話，目前使用 picture-book.js 裡的 mock AI 回覆 -->
    <section id="chat" class="view" aria-labelledby="chat-title">
      <div class="section-heading">
        <p class="eyebrow">角色對話</p>
        <h2 id="chat-title">AI 角色對話</h2>
        <p>選擇角色，提出你在繪本中看見的問題。現在使用 mock AI 回應，未來可替換為真正 API。</p>
      </div>

      <div class="chat-layout">
        <aside class="character-picker" aria-label="角色選擇">
          <button class="character-card active" data-role="lali" type="button">
            <img src="assets/character-lali-pangolin.png" alt="拉利，穿山甲角色圖">
            <span>拉利</span>
            <small>穿山甲</small>
          </button>
          <button class="character-card" data-role="aban" type="button">
            <img src="assets/character-aban-leopard-cat.png" alt="阿班，石虎角色圖">
            <span>阿班</span>
            <small>石虎</small>
          </button>
          <button class="character-card" data-role="dog" type="button">
            <span class="dog-avatar" aria-hidden="true">狗</span>
            <span>狗</span>
            <small>遊蕩犬</small>
          </button>
        </aside>

        <section class="chat-window" aria-label="角色聊天視窗">
          <div class="chat-top">
            <div class="active-character">
              <div id="activeRolePortrait" class="active-role-portrait" aria-hidden="true">
                <img id="activeRoleImage" src="assets/character-lali-pangolin.png" alt="">
              </div>
              <div>
              <p class="eyebrow">目前角色</p>
              <h3 id="activeRoleName">拉利（穿山甲）</h3>
              </div>
            </div>
            <button id="clearChat" class="icon-btn" type="button" title="清空對話">清空</button>
          </div>
          <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
          <form id="chatForm" class="chat-form">
            <label for="userMessage" class="sr-only">輸入想問角色的問題</label>
            <input id="userMessage" type="text" placeholder="輸入你想問角色的問題..." autocomplete="off">
            <button class="primary-btn" type="submit">送出</button>
          </form>
        </section>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>以淺山棲地、遊蕩犬與野生動物保育為主題的互動展示原型。</p>
  </footer>

  <script src="picture-book.js?v=20261003-6"></script>
  <script>
    document.querySelector('[data-view="action"]')?.remove();
    document.querySelector('#action')?.remove();
  </script>
</body>
</html>
